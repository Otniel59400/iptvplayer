name: Criar APK para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./iptv-player

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-APK
          path: iptv-player/app/build/outputs/apk/debug/app-debug.apk
